<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qurt magazin</title>
<style>
:root{--bg:#f3f3f7;--card:#fff;--tx:#14141f;--mu:#7b7b8c;--ac:#7000ff;--ac2:#fff;--bd:#e6e6ee;--rd:#ff2d55;--hd:#7000ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101016;--card:#1b1b25;--tx:#f2f2f7;--mu:#9a9aae;--ac:#9b5cff;--ac2:#fff;--bd:#2c2c3a;--hd:#4b1f99;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101016;--card:#1b1b25;--tx:#f2f2f7;--mu:#9a9aae;--ac:#9b5cff;--ac2:#fff;--bd:#2c2c3a;--hd:#4b1f99;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:78px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;padding:10px 12px 12px;border-radius:0 0 18px 18px}
header h1{font-size:19px;margin:0 0 8px}
.w{max-width:640px;margin:0 auto;padding:12px}
.s{width:100%;border:0;border-radius:12px;padding:11px 14px;font:inherit;background:#fff;color:#14141f}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 0;max-width:640px;margin:8px auto 0}
.chip{white-space:nowrap;border:0;border-radius:20px;padding:8px 14px;background:var(--card);color:var(--tx);font:inherit;font-size:14px}
.chip.on{background:var(--ac);color:var(--ac2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.card img,.ph{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bd)}
.ph{display:flex;align-items:center;justify-content:center;font-size:44px}
.bd{position:absolute;top:8px;left:8px;background:var(--rd);color:#fff;font-size:12px;font-weight:700;border-radius:8px;padding:3px 7px}
.in{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.pr{font-weight:800;font-size:17px}.old{color:var(--mu);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:400}
.add{margin-top:auto;display:flex;align-items:center;justify-content:space-between}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--ac);color:var(--ac2);font-weight:700}
.plus{width:38px;height:38px;border-radius:50%;padding:0;font-size:22px;line-height:1}
.step{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between;background:var(--bg);border-radius:20px;padding:2px}
.step button{width:36px;height:36px;border-radius:50%;padding:0;font-size:20px}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.r{background:var(--rd);color:#fff;padding:8px 12px}
input,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin:4px 0}
.pan{background:var(--card);border-radius:14px;padding:12px;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.mu{color:var(--mu);font-size:14px}.hid{display:none}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
nav button{background:none;color:var(--mu);font-size:12px;padding:4px 14px;position:relative;font-weight:600}
nav button.on{color:var(--ac)}nav button b{display:block;font-size:22px}
.cnt{position:absolute;top:-2px;right:6px;background:var(--rd);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
</style>
</head>

<script>
const SRC = document.documentElement.outerHTML;
let S;
try { S = JSON.parse(document.getElementById('state').textContent); } catch(e) { S = {shop:'Qurt magazin',tg:'',items:[]}; }
const app = document.getElementById('app');
let view = 'shop', cart = {}, cat = '', q = '', pendingImg = '', adm = false;
S.pw = S.pw || 'de7baa9a0859e641220ff2f51798c44a01d90eb71ed552b4d55a5e03a0d7b4de';
const sha = async s => [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
if (location.hash === '#boshqaruv') view = 'login';
const $ = (t,a={},...k) => { const e = document.createElement(t); for (const x in a) { if (x==='on') for (const ev in a.on) e.addEventListener(ev,a.on[ev]); else if (x==='cls') e.className=a[x]; else e[x]=a[x]; } k.flat().forEach(c => e.append(c)); return e; };
const sum = n => Number(n).toLocaleString('ru-RU') + ' soʻm';
const count = () => Object.values(cart).reduce((a,b)=>a+b,0);
function compress(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{ const k=Math.min(1,640/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',.75)); }; im.src=r.result; }; r.readAsDataURL(file); }); }
async function save(){
  const json = JSON.stringify(S).replace(/</g,'\\u003c');
  const html = '<!DOCTYPE html>\n' + SRC.replace(/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/, (m,a,b)=>a+json+b);
  const u = URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const l = document.createElement('a'); l.href = u; l.download = 'index.html'; document.body.append(l); l.click(); l.remove();
  alert('index.html yuklab olindi. Uni GitHub’dagi eski fayl oʻrniga yuklang.');
}
function tabs(){
  const t = (v,ic,lb,extra) => $('button',{cls:view===v?'on':'',on:{click:()=>{view=v;render();window.scrollTo(0,0);}}},$('b',{textContent:ic}),lb,extra||'');
  const c = count();
  return $('nav',{},t('shop','🏠','Doʻkon'),t('cart','🛒','Savat',c?$('span',{cls:'cnt',textContent:c}):''),adm?t('admin','⚙️','Boshqaruv'):'');
}
function shop(){
  const s = $('input',{cls:'s',placeholder:'Mahsulot qidirish',value:q,on:{input:e=>{q=e.target.value;grid();}}});
  const cats = [...new Set(S.items.map(i=>i.cat).filter(Boolean))];
  app.replaceChildren($('header',{},$('h1',{textContent:S.shop}),s));
  if (cats.length) app.append($('div',{cls:'chips'},[''].concat(cats).map(c=>$('button',{cls:'chip'+(cat===c?' on':''),textContent:c||'Hammasi',on:{click:()=>{cat=c;shop();}}}))));
  app.append($('div',{cls:'w',id:'g'}),tabs());
  grid();
}
function grid(){
  const box = document.getElementById('g'); if(!box) return;
  const list = S.items.filter(i=>(!cat||i.cat===cat)&&i.name.toLowerCase().includes(q.toLowerCase()));
  box.replaceChildren();
  if (!list.length) { box.append($('div',{cls:'pan mu',textContent:S.items.length?'Hech narsa topilmadi.':'Hozircha mahsulot yoʻq.'})); return; }
  const g = $('div',{cls:'grid'});
  list.forEach(it=>{
    const n = cart[it.id]||0, disc = it.old>it.price?Math.round((1-it.price/it.old)*100):0;
    const act = n ? $('div',{cls:'step'},$('button',{textContent:'−',on:{click:()=>{cart[it.id]--;if(!cart[it.id])delete cart[it.id];shop();}}}),String(n),$('button',{textContent:'+',on:{click:()=>{cart[it.id]++;shop();}}}))
      : $('button',{cls:'plus',textContent:'+',on:{click:()=>{cart[it.id]=1;shop();}}});
    g.append($('div',{cls:'card'},disc?$('span',{cls:'bd',textContent:'-'+disc+'%'}):'',it.img?$('img',{src:it.img,alt:it.name}):$('div',{cls:'ph',textContent:'🧀'}),
      $('div',{cls:'in'},$('div',{cls:'nm',textContent:it.name}),$('div',{},$('span',{cls:'pr',textContent:sum(it.price)}),it.old>it.price?$('span',{cls:'old',textContent:sum(it.old)}):''),$('div',{cls:'add'},act))));
  });
  box.append(g);
}
function cartView(){
  app.replaceChildren($('header',{},$('h1',{textContent:'Savat'})));
  const w = $('div',{cls:'w'}); app.append(w,tabs());
  let total = 0; const lines = [];
  S.items.forEach(it=>{ const n=cart[it.id]; if(!n) return; total+=n*it.price; lines.push(it.name+' x'+n+' = '+sum(n*it.price));
    w.append($('div',{cls:'row'},it.img?$('img',{src:it.img,style:'width:52px;height:52px;border-radius:10px;object-fit:cover'}):'🧀',$('div',{style:'flex:1'},$('div',{textContent:it.name}),$('b',{textContent:sum(it.price)})),
      $('div',{cls:'step',style:'width:auto'},$('button',{textContent:'−',on:{click:()=>{cart[it.id]--;if(!cart[it.id])delete cart[it.id];cartView();}}}),String(n),$('button',{textContent:'+',on:{click:()=>{cart[it.id]++;cartView();}}})))); });
  if (!lines.length) { w.append($('div',{cls:'pan mu',textContent:'Savat boʻsh.'})); return; }
  w.append($('div',{cls:'row'},$('b',{textContent:'Jami'}),$('b',{textContent:sum(total)})));
  const nm = $('input',{placeholder:'Ismingiz'}), ph = $('input',{placeholder:'Telefon raqamingiz',type:'tel'}), ad = $('textarea',{placeholder:'Yetkazib berish manzili',rows:2});
  w.append(nm,ph,ad,$('button',{style:'width:100%;padding:14px;margin-top:6px',textContent:'Buyurtma berish',on:{click:async()=>{
    if(!nm.value.trim()||!ph.value.trim()){alert('Ism va telefon raqamini kiriting.');return;}
    const t = 'Yangi buyurtma:\n'+lines.join('\n')+'\nJami: '+sum(total)+'\nIsm: '+nm.value+'\nTel: '+ph.value+'\nManzil: '+ad.value;
    if(S.bt&&S.gid){
      try{ const r=await fetch('https://api.telegram.org/bot'+S.bt+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:S.gid,text:t})}); const j=await r.json(); if(j.ok){cart={};alert('Buyurtma yuborildi ✓ Tez orada bogʻlanamiz.');view='shop';render();return;} }catch(e){}
      alert('Yuborilmadi. Qayta urinib koʻring.'); return;
    }
    if(!S.tg){alert('Doʻkon Telegram manzili hali kiritilmagan.');return;}
    window.open('https://t.me/'+S.tg.replace(/^@/,'')+'?text='+encodeURIComponent(t),'_blank');
  }}}),$('div',{cls:'mu',textContent:'Buyurtmangiz doʻkon egasiga yuboriladi.'}));
}
function adminView(){
  app.replaceChildren($('header',{},$('h1',{textContent:'Boshqaruv'})));
  const w = $('div',{cls:'w'}); app.append(w,tabs());
  const sh = $('input',{value:S.shop,placeholder:'Doʻkon nomi'}), tg = $('input',{value:S.tg,placeholder:'Telegram username (masalan: @zohid)'}), bt = $('input',{value:S.bt||'',placeholder:'Bot token (buyurtmalar guruhga tushishi uchun)'}), gid = $('input',{value:S.gid||'',placeholder:'Guruh ID (masalan: -1001234567890)'}), np = $('input',{type:'password',placeholder:'Yangi parol (oʻzgartirish uchun)'});
  w.append($('div',{cls:'pan'},$('b',{textContent:'Sozlamalar'}),sh,tg,bt,gid,np));
  const nn = $('input',{placeholder:'Mahsulot nomi'}), pr = $('input',{placeholder:'Narxi (soʻm)',type:'number',inputMode:'numeric'}), op = $('input',{placeholder:'Eski narxi (chegirma uchun, ixtiyoriy)',type:'number',inputMode:'numeric'}), ct = $('input',{placeholder:'Boʻlim (masalan: Qurt, Sut mahsulotlari)'});
  const pv = $('img',{cls:'hid',style:'width:90px;border-radius:10px'});
  const f = $('input',{type:'file',accept:'image/*',on:{change:async e=>{ const x=e.target.files[0]; if(!x)return; try{pendingImg=await compress(x);pv.src=pendingImg;pv.classList.remove('hid');}catch(_){alert('Rasm oʻqilmadi.');} }}});
  w.append($('div',{cls:'pan'},$('b',{textContent:'Yangi mahsulot'}),nn,pr,op,ct,f,pv,
    $('button',{style:'width:100%;margin-top:6px',textContent:'Qoʻshish',on:{click:()=>{ if(!nn.value.trim()||!(+pr.value>0)){alert('Nom va narxni kiriting.');return;} S.items.push({id:Date.now().toString(36),name:nn.value.trim(),price:+pr.value,old:+op.value||0,cat:ct.value.trim(),img:pendingImg}); pendingImg=''; adminView(); }}})));
  S.items.forEach(it=>w.append($('div',{cls:'row'},it.img?$('img',{src:it.img,style:'width:48px;height:48px;border-radius:8px;object-fit:cover'}):'🧀',$('div',{style:'flex:1',textContent:it.name+' · '+sum(it.price)}),
    $('button',{cls:'r',textContent:'✕',on:{click:()=>{S.items=S.items.filter(x=>x.id!==it.id);adminView();}}}))));
  w.append($('button',{style:'width:100%;padding:14px;margin-top:14px',textContent:'Yuklab olish (index.html)',on:{click:async()=>{ S.shop=sh.value.trim()||'Qurt magazin'; S.tg=tg.value.trim(); S.bt=bt.value.trim(); S.gid=gid.value.trim(); if(np.value) S.pw=await sha(np.value); await save(); }}}));
}
function login(){
  const p = $('input',{type:'password',placeholder:'Parol'}), msg = $('div',{cls:'mu'});
  const go = async()=>{ if(await sha(p.value)===S.pw){adm=true;view='admin';render();} else msg.textContent='Parol notoʻgʻri.'; };
  app.replaceChildren($('header',{},$('h1',{textContent:'Kirish'})));
  app.append($('div',{cls:'w'},p,$('button',{style:'width:100%;padding:14px',textContent:'Kirish',on:{click:go}}),msg,$('button',{cls:'g',style:'width:100%;margin-top:10px',textContent:'← Doʻkonga qaytish',on:{click:()=>{view='shop';render();}}})));
}
function render(){ if(view==='admin'&&!adm) view='login'; ({shop,cart:cartView,admin:adminView,login})[view](); }
render();
</script></body></html>
